<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFBF7">
<meta name="robots" content="noindex">
<title>Kochplan</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Karla:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FCFBF7;--card:#FFF;--ink:#16211B;--muted:#6E7C73;--line:#E4E1D6;--f3:#9E3355;--f2:#B5820F;--f1:#256B6E;--green:#1F5D3C;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Karla",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;letter-spacing:-.02em;margin:0}
.eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
p{margin:0 0 12px}
header{position:sticky;top:0;z-index:20;background:rgba(252,251,247,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0}
.hd h1{font-size:21px;line-height:1.1;flex:1;min-width:0}
.hd h1 small{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btn{width:36px;height:36px;flex:0 0 36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}
.nav-btn:disabled{opacity:.2;cursor:default}
button{font:inherit}
section.view{display:none;padding:13px 0 6px}
section.view.on{display:block}
.buybox{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:7px 12px 8px;margin-bottom:15px}
.buybox::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:9px solid var(--ink)}
.buybox .r1{display:flex;align-items:center;gap:9px}
.buybox .r1 b{font-family:"Bricolage Grotesque",serif;font-weight:800;font-size:16px}
.buybox .sp{flex:1}
.buybox .r2{margin-top:3px;font-size:12px;color:var(--muted);line-height:1.4}
.buybox .drop{display:block;color:var(--f2);margin-top:2px}
.dayblock{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:6px;overflow:hidden}
.dayhead{display:flex;align-items:center;gap:7px;padding:2px 6px 2px 10px;background:#F4F2EA;border-bottom:1px solid var(--line)}
.dayhead b{font-family:"DM Mono",monospace;font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.dayhead .dd{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--muted)}
.dayhead .sp{flex:1}
.dayblock.today{border:2px solid var(--f3);background:#FBE9EE}
.dayblock.today .dayhead{background:#F6D9E1;border-bottom-color:#EBC0CD}
.dayblock.today .dayhead b{color:var(--f3)}
.dayblock.today .dish{background:#FFF}
.tag{font-family:"DM Mono",monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--f3);color:#FFF;border-radius:99px;padding:2px 6px}
.dishes{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px}
.dishes.one{grid-template-columns:1fr}
.dish{display:flex;align-items:stretch;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.dish .body{flex:1;min-width:0;display:flex;gap:8px;align-items:center;padding:5px 2px 5px 5px;text-align:left;background:none;border:none;cursor:pointer;color:inherit}
.dish .thumb{width:40px;height:40px;flex:0 0 40px;border-radius:8px;object-fit:cover;background:#EFEDE4;display:block}
.dish .txt{min-width:0;flex:1}
.dish h3{font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.dish .meta{margin-top:2px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dish .fresh{display:block;margin-top:1px;font-size:11px;color:var(--green);line-height:1.25;overflow-wrap:anywhere}
.dish .more{flex:0 0 26px;border:none;background:none;color:var(--muted);font-size:15px;cursor:pointer;padding:0}
.dish .more:active{background:#EFEDE4}
.dish.out{opacity:.55}
.dish.out h3{text-decoration:line-through}
.chip{font-family:"DM Mono",monospace;font-size:10.5px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 7px;white-space:nowrap}
.icon{width:30px;height:24px;border:none;background:none;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
.icon:active{background:#EFEDE4}
.icon[disabled]{opacity:.25}
.grp{margin-bottom:6px}
.shophead{display:flex;align-items:center;gap:8px;width:100%;background:var(--paper);border:none;padding:11px 2px 6px;cursor:pointer;color:inherit;text-align:left;border-top:1px solid var(--line);position:sticky;top:56px;z-index:5}
.grp:first-child .shophead{border-top:none;padding-top:2px}
.shophead b{font-family:"Bricolage Grotesque",serif;font-weight:800;font-size:16px;flex:1}
.shophead .n{font-family:"DM Mono",monospace;font-size:12px;color:var(--muted)}
.shophead .cv{font-size:11px;color:var(--muted);transition:transform .15s}
.grp.folded .cv{transform:rotate(-90deg)}
.grp.folded .body{display:none}
.aisle{display:flex;align-items:center;gap:2px;font-family:"DM Mono",monospace;font-weight:500;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);margin:18px 0 3px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.aisle:first-child{margin-top:6px}
.aisle.empty{color:var(--muted);opacity:.65}
.plus{width:26px;height:22px;flex:0 0 26px;border:none;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0;border-radius:6px;cursor:pointer;opacity:.6}
.plus:active{background:#EFEDE4}
.plus.on{color:var(--f1);opacity:1}
.more{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.item{display:flex;align-items:baseline;gap:7px;padding:4px 2px;cursor:pointer;line-height:1.3}
.box{flex:0 0 26px;width:26px;height:26px;border:1.5px solid var(--ink);border-radius:6px;position:relative;top:0;background:var(--card);cursor:pointer;padding:0}
.item .box::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(42deg);opacity:0}
.item.done .box{background:var(--ink)}
.item.done .box::after{opacity:1}
.item{align-items:center}
.item .nm{flex:0 1 auto;min-width:0;font-size:15px}
.usesbtn{background:none;border:none;padding:0 0 0 3px;color:var(--muted);font-size:11.5px;font-family:"DM Mono",monospace;text-decoration:underline;cursor:pointer}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 0 0 4px}
.item.manual .nm{color:var(--f1);font-weight:700}
.item.manual .box{border-color:var(--f1)}
.item.manual.done .box{background:var(--f1)}
.additem{display:flex;gap:8px;padding:8px 0 2px}
.additem input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:14px}
.additem button{width:38px;flex:0 0 38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.item .lead{flex:1 1 10px;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:8px}
.item .qt{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--muted);white-space:nowrap}
.item .qt em{font-style:normal;opacity:.6}
.item.done .nm,.item.done .qt{color:var(--muted);text-decoration:line-through}
.portbar{display:flex;align-items:center;gap:8px;padding:0 0 10px}
.portbar .lbl{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.portbar b{font-family:"DM Mono",monospace;font-size:16px;min-width:18px;text-align:center}
.portbar .hint{flex:1;text-align:right;font-size:12px;color:var(--muted)}
.step{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;line-height:1;cursor:pointer}
.step:active{transform:scale(.94)}
.step:disabled{opacity:.3;cursor:default}
.step:disabled:active{transform:none}
.nutri .head{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:8px 12px 9px;margin-bottom:14px}
.nutri .head b{font-family:"Bricolage Grotesque",serif;font-weight:800;font-size:16px}
.nutri .head .r1{display:flex;align-items:center;gap:9px}
.nutri .head .sp{flex:1}
.nutri .head .r2{margin-top:3px;font-size:12px;color:var(--muted);line-height:1.4}
.nutri .head .warn{display:block;color:var(--f2);margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px 8px}
.tile .k{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:"Bricolage Grotesque",serif;font-weight:800;font-size:22px;line-height:1.1}
.tile .v em{font-style:normal;font-family:"DM Mono",monospace;font-weight:400;font-size:11px;color:var(--muted)}
.tile .pc{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--muted)}
.ngrp{display:flex;align-items:baseline;gap:8px;font-family:"DM Mono",monospace;font-weight:500;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);margin:19px 0 2px;padding:0 2px 4px;border-bottom:1px solid var(--line)}
.ngrp span{flex:0 0 auto;margin-left:auto;letter-spacing:.02em;text-transform:none;font-size:9.5px;color:var(--muted);white-space:nowrap}
.nrow{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #F3F1E8}
.nrow .nm{flex:1 1 auto;min-width:0;font-size:14px;overflow-wrap:anywhere}
.nrow .vv{font-family:"DM Mono",monospace;font-size:12.5px;white-space:nowrap}
.nrow .bar{flex:0 0 64px;height:6px;border-radius:99px;background:#EFEDE4;overflow:hidden}
.nrow .bar i{display:block;height:100%;background:var(--f1);border-radius:99px}
.nrow .bar i.warn{background:var(--f2)}
.nrow .bar i.over{background:var(--f3)}
.nrow .pc{flex:0 0 40px;text-align:right;font-family:"DM Mono",monospace;font-size:11.5px;color:var(--muted)}
.nrow .pc.low{color:var(--f2)}
.nrow .pc.over{color:var(--f3)}
.nrow.sub .nm{padding-left:13px;font-size:13px;color:var(--muted)}
.rbody{display:flex;gap:10px;align-items:stretch;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.nbox{flex:0 0 106px;border-left:1px solid var(--line);padding:6px 0 6px 10px}
.nbox .lbl{display:block;font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.nbox .r{display:flex;justify-content:space-between;align-items:baseline;gap:5px;font-family:"DM Mono",monospace;font-size:11.5px;line-height:1.5}
.nbox .r em{font-style:normal;color:var(--muted)}
.nbox .r b{font-weight:500;white-space:nowrap}
.nbox .gap{display:block;margin-top:5px;font-size:10.5px;line-height:1.3;color:var(--f2)}
@media (max-width:389px){
.rbody{display:block}
.nbox{border-left:none;border-top:1px solid var(--line);padding:6px 0 2px;margin-top:4px}
.nbox .r{display:inline-flex;gap:6px;margin-right:12px}
}
.nfoot{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.nfoot b{color:var(--ink)}
.nfoot h4{font-family:"DM Mono",monospace;font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:13px 0 3px}
.nrow .bar.none{background:none}
.nrow .pc.dash{color:var(--line)}
.nrow .nm .src{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 5px;vertical-align:1px}
body.locked>*:not(#gate){display:none!important}
#gate{display:none;position:fixed;inset:0;z-index:60;background:var(--paper);padding:calc(env(safe-area-inset-top) + 8vh) 18px 20px;overflow:auto}
body.locked #gate{display:block}
.gatebox{max-width:340px;margin:0 auto}
.gatebox h1{font-size:29px;letter-spacing:-.03em}
.gatebox .sub{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 20px}
.gatebox p{font-size:14px;color:var(--muted);line-height:1.5}
.pwrow{position:relative;margin:4px 0 10px}
.gatebox input{width:100%;font:inherit;font-size:16px;padding:12px 74px 12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
.gatebox button{width:100%;font:inherit;font-size:15px;font-weight:700;padding:12px;border:none;border-radius:12px;background:var(--ink);color:var(--paper);cursor:pointer}
.gatebox button:disabled{opacity:.5;cursor:default}
.gatebox .pwrow button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;padding:6px 9px;border:none;border-radius:8px;background:none;color:var(--muted);font-family:"DM Mono",monospace;font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.gatebox .pwrow button:active{background:#EFEDE4}
.gatebox .msg{min-height:20px;font-size:13.5px;margin:10px 0 0}
.gatebox .msg.bad{color:var(--f3)}
.listbar{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:2px}
.listbar .prog{font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);flex:1;margin:0}
.mini{background:none;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.mini.on{border-color:var(--ink);color:var(--ink)}
.incoming{border:1px solid var(--green);background:#F0F7F1;border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14px}
.incoming .row{display:flex;gap:8px;margin-top:10px}
.incoming button{flex:1;border-radius:99px;padding:8px 12px;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.incoming button.yes{background:var(--green);border-color:var(--green);color:#F4F8F1;font-weight:700}
.sheet input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-family:"DM Mono",monospace;font-size:13px}
.chip.sw{border-style:dashed;border-color:var(--f2);color:var(--f2)}
.chip.off{border-color:var(--muted);color:var(--muted)}
.chip.art{border-color:var(--f1);color:var(--f1)}
.pick{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px dotted var(--line);padding:11px 2px;cursor:pointer;color:inherit;font-size:15px;font-family:inherit}
.pick .m{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--muted);float:right;padding-top:3px}
.pick.used{opacity:.4}
.pick:active{background:#EFEDE4}
#plist{max-height:52vh;overflow-y:auto}
.scrim{position:fixed;inset:0;background:rgba(22,33,27,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-radius:14px 14px 0 0;max-height:100vh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.9,.3,1);padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
@supports (height:100dvh){.sheet{max-height:100dvh}}
.sheet.on{transform:translateY(0)}
.sheet.tall{top:0;bottom:auto;height:auto;max-height:100vh;border-radius:0 0 16px 16px;padding-bottom:20px}
.sheet.tall{transform:translateY(100vh)}
.sheet.tall.on{transform:translateY(0)}
@supports (height:100dvh){
.sheet.tall{max-height:100dvh;transform:translateY(100dvh)}
.sheet.tall.on{transform:translateY(0)}
}
.sheettop{position:sticky;top:0;z-index:3;background:var(--paper);height:calc(20px + env(safe-area-inset-top));margin:0 -16px 0;padding-top:env(safe-area-inset-top)}
.grab{width:34px;height:4px;background:var(--line);border-radius:9px;margin:8px auto 0}
.sheetx{position:absolute;right:6px;top:calc(env(safe-area-inset-top) - 2px);width:38px;height:30px;border:none;background:none;color:var(--muted);font-size:21px;line-height:1;cursor:pointer;z-index:4}
.sheetx:active{color:var(--ink)}
.eyebrow .src{color:var(--green);text-decoration:underline}
.sheet h2{font-size:24px;line-height:1.08;margin:1px 0 0}
.rhead{display:flex;gap:11px;align-items:flex-start;margin-top:2px}
.rhead .txt{flex:1;min-width:0}
.rhead .hero{flex:0 0 62px;width:62px;height:62px;object-fit:cover;border-radius:9px;background:#EFEDE4;border:none;padding:0;cursor:zoom-in;display:block}
.zoomwrap{position:fixed;inset:0;z-index:60;background:#16211B;display:none;place-items:center;padding:10px;cursor:zoom-out}
.zoomwrap.on{display:grid}
.zoomwrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;display:block}
.ings{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 0 6px;margin-top:10px}
.rbody .ings{flex:1 1 auto;min-width:0;border:none;margin:0;padding:6px 0}
.rbody .ings .ing .qt{flex:0 0 66px;padding-right:12px}
.rbody .ings .ing .nm{flex:0 0 auto}
.rbody .ings .ing .prep{flex:1 1 40px}
.sheet .ing{display:flex;align-items:baseline;padding:1.5px 0;line-height:1.4;font-size:15px;min-width:0}
.sheet .ing .qt{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--ink);flex:0 0 78px;text-align:right;white-space:nowrap;padding-right:18px}
.sheet .ing .nm{flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.sheet .ing .prep{flex:0 1 auto;min-width:0;color:var(--muted);font-family:"DM Mono",monospace;font-size:11.5px;overflow-wrap:anywhere;padding-left:9px;margin-left:8px;border-left:1px solid var(--line)}
.sheet .ing.noshop .qt{color:var(--f1)}
.sheet ol{padding-left:0;list-style:none;counter-reset:s;margin:0}
.sheet ol li{counter-increment:s;padding:5px 0 5px 26px;position:relative;border-bottom:1px dotted var(--line)}
.sheet ol li:last-child{border-bottom:none}
.sheet ol li::before{content:counter(s);position:absolute;left:0;top:6px;font-family:"DM Mono",monospace;font-size:10.5px;color:var(--paper);background:var(--ink);width:19px;height:19px;border-radius:6px;display:grid;place-items:center}
.sheet h3.sub{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:11px 0 2px}
.sheet h2{font-size:22px}
.sc{font-style:normal;font-weight:700;color:var(--f1);background:#E7F0F0;border-radius:4px;padding:0 3px}
.pbar{display:flex;align-items:center;gap:8px;margin:7px 0 0}
.pbar .lbl{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pbar b{font-family:"DM Mono",monospace;font-size:15px;min-width:16px;text-align:center}
.pbar .hint{flex:1;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.3}
.pbar .rst{border:none;background:none;color:var(--f1);font-size:11.5px;font-family:"DM Mono",monospace;text-decoration:underline;cursor:pointer;padding:0}
.pick .pst{float:right;display:flex;align-items:center;gap:6px;margin:-2px 0 0 8px}
.pick .pst b{font-family:"DM Mono",monospace;font-size:13px;min-width:14px;text-align:center}
.chip.pt{border-color:var(--f1);color:var(--f1)}
.pick.basket{cursor:pointer}
.pick.basket .ttl{display:block;padding-right:96px}
.pick.basket.used .ttl{color:var(--muted);text-decoration:line-through}
.pick.basket .sub2{display:block;font-family:"DM Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:2px}
.pick.basket.used{opacity:1}

if (+t.dataset.pick === base[slot]) delete sw[slot]; else sw[slot] = +t.dataset.pick;
setSwaps(cur, sw);
closeSheet();
return render();
}
if (t.dataset.open !== undefined) return openRecipe(+t.dataset.open);
if (t.dataset.openid !== undefined) return openRecipeById(+t.dataset.openid);
if (t.dataset.addday !== undefined) return openAdd(+t.dataset.addday, "");
if (t.dataset.adddish !== undefined) {
var pa = t.dataset.adddish.split("|"), sl2 = +pa[0], aid = +pa[1];
var ad = addsOf(cur), lst = (ad[sl2] || []).slice(), at = lst.indexOf(aid);
if (at >= 0) lst.splice(at, 1); else lst.push(aid);
ad[sl2] = lst;
setAdds(cur, ad);
closeSheet();
return render();
}
if (t.dataset.unadd !== undefined) {
var pu = t.dataset.unadd.split("|"), su = +pu[0], ru = +pu[1];
var au = addsOf(cur);
au[su] = (au[su] || []).filter(function (id) { return id !== ru; });
setAdds(cur, au);
closeSheet();
return render();
}
if (t.dataset.menu !== undefined) return openMenu(t.dataset.menu);
if (t.dataset.buyday !== undefined) return openBuyDay();
if (t.dataset.bd !== undefined) return askBuyMode(+t.dataset.bd);
if (t.dataset.bmode !== undefined) {
var bm = t.dataset.bmode.split("|"), n2 = +bm[1];
closeSheet();
if (bm[0] === "einmal") { setShift(cur, n2); return render(); }
var neu = KP.addDays(KP.fromISO(cur), n2).getDay();
setAnchor(neu === 0 ? 6 : neu);
setShift(cur, 0);
cur = KP.iso(startOf());
return render();
}
if (t.dataset.basket !== undefined) return openBasket();
if (t.dataset.up !== undefined || t.dataset.down !== undefined) {
var up = t.dataset.up !== undefined;
var i = +(up ? t.dataset.up : t.dataset.down), j = up ? i - 1 : i + 1;
if (j < 0 || j >= KP.DAYS) return;
var p = permOf(cur), x = p[i];
p[i] = p[j]; p[j] = x;
setPerm(cur, p);
return render();
}
if (t.dataset.tick) { tick(cur, t.dataset.tick); return render(); }
if (t.dataset.del !== undefined) {
var mo = manuals(); delete mo[t.dataset.del]; setManuals(mo);
var dd = ticks(cur); if (dd[t.dataset.del]) { delete dd[t.dataset.del]; LS.set("kp.done." + cur, JSON.stringify(dd)); }
return render();
}
if (t.dataset.uses !== undefined) return showUses(t.dataset.uses);
if (t.dataset.goto !== undefined) return openRecipeById(+t.dataset.goto);
if (t.dataset.add !== undefined) {
var same = ADD && ADD.s === t.dataset.add && ADD.a === t.dataset.aisle;
ADD = same ? null : { s: t.dataset.add, a: t.dataset.aisle };
ADDFOCUS = !same;
return render();
}
if (t.dataset.addshop !== undefined) {
ADD = { s: t.dataset.addshop, a: firstAisle() };
ADDFOCUS = true;
return render();
}
if (t.dataset.shop) {
setFold(cur, t.dataset.shop, t.parentNode.classList.contains("folded") ? "auf" : "zu");
return render();
}
if (t.dataset.v) {
document.querySelectorAll("section.view").forEach(function (s) { s.classList.toggle("on", s.id === "v-" + t.dataset.v); });
document.querySelectorAll("nav.tabs button").forEach(function (b) { b.classList.toggle("on", b === t); });
window.scrollTo({ top: 0 });
}
});
$("#zoom").onclick = function () { this.classList.remove("on"); this.innerHTML = ""; };
document.addEventListener("keydown", function (e) {
if (e.key !== "Escape") return;
var z = $("#zoom");
if (z.classList.contains("on")) { z.classList.remove("on"); z.innerHTML = ""; return; }
if ($("#sheet").classList.contains("on")) closeSheet();
});
$("#prev").onclick = function () { cur = KP.iso(KP.addDays(KP.fromISO(cur), -7)); ADD = null; render(); };
$("#next").onclick = function () { cur = KP.iso(KP.addDays(KP.fromISO(cur), 7)); ADD = null; render(); };
$("#uncheck").onclick = function () { LS.set("kp.done." + cur, "{}"); LS.set("kp.fold." + cur, "{}"); render(); };
$("#toggleDone").onclick = function () { LS.set("kp.showdone", showDone() ? "0" : "1"); render(); };
$("#share").onclick = openShare;
$("#pMinus").onclick = function () { if (portions() > 1) { setPortions(portions() - 1); render(); } };
$("#pPlus").onclick = function () { if (portions() < 12) { setPortions(portions() + 1); render(); } };
$("#lock").onclick = function () { KP_LOCK(); };
cur = KP.iso(startOf());
render();
checkIncoming();
}
</script>
